[project]
name = "explainer-backend"
version = "0.1.0"
description = "AI research to video explainer backend API"
authors = [{name = "Leandro", email = "leandrofahud@gmail.com"}]
requires-python = ">=3.10"

dependencies = [
    "fastapi[standard]>=0.104.0",
    "python-multipart>=0.0.6",
    "langchain>=0.1.0",
    "ollama>=0.1.0",
    "openai>=1.0.0",
    "moviepy>=1.0.3",
    "ffmpeg-python>=0.2.0",
    "elevenlabs>=0.2.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "prometheus-client>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310" 