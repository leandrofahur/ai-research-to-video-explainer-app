[project]
name = "explainer-frontend"
version = "0.1.0"
description = "AI research to video explainer frontend interface"
authors = [{name = "Leandro", email = "leandrofahud@gmail.com"}]
requires-python = ">=3.10"

dependencies = [
    "streamlit>=1.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310" 